<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTMForge Asset Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f3ff 0%, #fce7f3 50%, #dbeafe 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes shimmer {
            0% { background-position: -100% 0; }
            100% { background-position: 200% 0; }
        }
        
        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 60px 50px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 20px 60px rgba(147, 51, 234, 0.2),
                0 0 60px rgba(236, 72, 153, 0.15),
                0 0 100px rgba(59, 130, 246, 0.1);
            max-width: 700px;
            width: 100%;
            animation: fadeIn 1s ease-out;
            text-align: center;
        }
        
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }
        
        .title-gtm {
            color: #1f2937;
        }
        
        .title-forge {
            background: linear-gradient(135deg, #9333ea 0%, #ec4899 50%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: shimmer 3s linear infinite;
        }
        
        .divider {
            width: 64px;
            height: 4px;
            background: linear-gradient(90deg, #9333ea, #ec4899);
            margin: 0 auto 32px;
            border-radius: 2px;
        }
        
        .subtitle {
            font-size: 1.25rem;
            color: #4b5563;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        p {
            color: #6b7280;
            line-height: 1.7;
            font-size: 1rem;
            margin-bottom: 12px;
        }
        
        code {
            background: rgba(147, 51, 234, 0.1);
            padding: 4px 12px;
            border-radius: 6px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
            color: #9333ea;
            border: 1px solid rgba(147, 51, 234, 0.2);
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #9333ea 0%, #ec4899 100%);
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            margin-top: 32px;
            font-weight: 600;
            font-size: 1rem;
            box-shadow: 0 8px 20px rgba(147, 51, 234, 0.3);
            transition: all 0.3s ease;
        }
        
        .status:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(147, 51, 234, 0.4);
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }
        
        .info-grid {
            display: grid;
            gap: 16px;
            margin-top: 32px;
            text-align: left;
        }
        
        .info-item {
            background: rgba(255, 255, 255, 0.5);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(147, 51, 234, 0.1);
            transition: all 0.3s ease;
        }
        
        .info-item:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: rgba(147, 51, 234, 0.3);
            transform: translateX(4px);
        }
        
        .info-label {
            font-size: 0.875rem;
            color: #9333ea;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 1rem;
            color: #374151;
            font-weight: 500;
        }
        
        @media (max-width: 640px) {
            .container {
                padding: 40px 30px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="title-gtm">GTM</span><span class="title-forge">Forge</span>
        </h1>
        <div class="divider"></div>
        
        <p class="subtitle">Asset Server</p>
        
        <p>Welcome to the GTMForge Asset Server! This server delivers all generated assets from your startup builds.</p>
        
        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Serving From</div>
                <div class="info-value"><code>asset_server_root/</code></div>
            </div>
            
            <div class="info-item">
                <div class="info-label">Asset Types</div>
                <div class="info-value">Research Reports, UI Mockups, Videos, Documents</div>
            </div>
            
            <div class="info-item">
                <div class="info-label">Access</div>
                <div class="info-value">Assets organized by session ID</div>
            </div>
        </div>
        
        <div class="status">
            <span class="status-dot"></span>
            Server is running
        </div>
    </div>
</body>
</html>
