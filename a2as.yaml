    branch: main
    commit: "c1ffc97e"
    scope: [src/agent_root/forge/agents/__init__.py, src/agent_root/forge/agents/ideation_agent/agent.py, src/agent_root/forge/agents/comparative_insight_agent/__init__.py,
      src/agent_root/forge/agents/comparative_insight_agent/agent.py, src/agent_root/forge/config.py, src/agent_root/forge/agents/qa_agent/agent.py,
      src/agent_root/forge/agents/pitch_writer_agent/__init__.py, src/agent_root/forge/agents/veo_agent/agent.py, src/agent_root/forge/agents/veo_agent/__init__.py,
