  CallbackContext: google.adk.agents.callback_context.CallbackContext
  CanvaAgent: agent.CanvaAgent
  CanvaOutput: app.core.schemas.CanvaOutput
  CanvaPage: app.core.schemas.CanvaPage
  ComparativeInsightAgent: agent.ComparativeInsightAgent
  ComparativeInsightOutput: app.core.schemas.ComparativeInsightOutput
  config: config.config
  datetime: datetime
  deep_research_agent: agents.deep_research.root_agent
  Dict: typing.Dict
  Event: google.adk.events.Event
  EventActions: google.adk.events.EventActions
  Field: pydantic.Field
  genai_types: google.genai.types
  GeneratedImage: app.core.schemas.GeneratedImage
  GeneratedVideo: app.core.schemas.GeneratedVideo
  google_search: google.adk.tools.google_search
  GoogleCloudStorageClient: app.utils.google_clients.GoogleCloudStorageClient
  ICP: app.core.schemas.ICP
  IdeationAgent: agent.IdeationAgent
  IdeationOutput: app.core.schemas.IdeationOutput
  ImagenAgent: agent.ImagenAgent
  ImagenOutput: app.core.schemas.ImagenOutput
  InvocationContext: google.adk.agents.invocation_context.InvocationContext
  json: json
  List: typing.List
  Literal: typing.Literal
  LlmAgent: google.adk.agents.LlmAgent
  logging: logging
  LoopAgent: google.adk.agents.LoopAgent
  ManifestAsset: app.core.schemas.ManifestAsset
  model_validator: pydantic.model_validator
  Optional: typing.Optional
  os: os
  Path: pathlib.Path
  PILImage: PIL.Image
  PipelineState: app.core.schemas.PipelineState
  PitchNarrativeOutput: app.core.schemas.PitchNarrativeOutput
  PitchWriterAgent: agent.PitchWriterAgent
  PromptForgeAgent: agent.PromptForgeAgent
  PromptForgeOutput: app.core.schemas.PromptForgeOutput
  PromptSpec: app.core.schemas.PromptSpec
  PublisherAgent: agent.PublisherAgent
  PublishOutput: app.core.schemas.PublishOutput
  QAAgent: agent.QAAgent
  QAReport: app.core.schemas.QAReport
  re: re
  RealCanvaConnectClient: app.utils.real_api_clients.RealCanvaConnectClient
  RealImagenClient: app.utils.real_api_clients.RealImagenClient
  RealVeoClient: app.utils.real_api_clients.RealVeoClient
  root_agent: agent.root_agent
  SequentialAgent: google.adk.agents.SequentialAgent
  SlideContent: app.core.schemas.SlideContent
  StartupIdeaInput: app.core.schemas.StartupIdeaInput
  time: time
  Type: typing.Type
  uuid: uuid
  VeoAgent: agent.VeoAgent
  VeoOutput: app.core.schemas.VeoOutput

functions:
  __init__:
    type: sync
    module: src.agent_root.forge.agents.prompt_forge_agent.agent
    args: [self, max_refinement_cycles]
  _async_sleep:
    type: async
    module: src.agent_root.forge.agents.imagen_agent.agent
    args: [self, seconds]
  _run_async_impl:
    type: async
    module: src.agent_root.forge.agents.deep_research.agent
    args: [self, ctx]
    params:
      returns: AsyncGenerator
  _upload_canva_assets:
    type: async
    module: src.agent_root.forge.agents.publisher_agent.agent
    args: [self, canva_output, manifest_id]
    params:
      returns: List[ManifestAsset]
  _upload_imagen_assets:
    type: async
    module: src.agent_root.forge.agents.publisher_agent.agent
    args: [self, imagen_output, manifest_id]
    params:
      returns: List[ManifestAsset]
  _upload_veo_assets:
    type: async
    module: src.agent_root.forge.agents.publisher_agent.agent
    args: [self, veo_output, manifest_id]
    params:
      returns: List[ManifestAsset]
  _validate_canva_output:
    type: async
    module: src.agent_root.forge.agents.qa_agent.agent
    args: [self, canva_output]
    params:
      returns: Dict
  _validate_imagen_output:
    type: async
    module: src.agent_root.forge.agents.qa_agent.agent
    args: [self, imagen_output]
    params:
      returns: Dict
  _validate_veo_output:
    type: async
    module: src.agent_root.forge.agents.qa_agent.agent
    args: [self, veo_output]
    params:
      returns: Dict
  citation_replacement_callback:
    type: sync
    module: src.agent_root.forge.agents.deep_research.agent
    args: [callback_context]
    params:
      returns: genai_types.Content
  collect_research_sources_callback:
    type: sync
    module: src.agent_root.forge.agents.deep_research.agent
    args: [callback_context]
    params:
      returns: None
  input_schema:
    type: sync
    module: src.agent_root.forge.agents.prompt_forge_agent.agent
    args: [self]
    params:
      returns: Type[BaseModel]
  load_prompts_from_disk:
    type: sync
    module: src.agent_root.forge.config
    args: [cls, data]
    params:
      returns: dict
  output_schema:
    type: sync
    module: src.agent_root.forge.agents.prompt_forge_agent.agent
    args: [self]
    params:
      returns: Type[BaseModel]
  run:
    type: async
    module: src.agent_root.forge.agents.prompt_forge_agent.agent
    args: [self, input_data]
    params:
      returns: PromptForgeOutput
  tag_replacer:
    type: sync
    module: src.agent_root.forge.agents.deep_research.agent
    args: [match]
    params:
      returns: str

variables:
  LUNA_PROMPTS_PATH:
    type: env
    params:
      caller: [os.environ.get]
      path: [src.agent_root.forge.config]

files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.md']
      caller: [load_prompts_from_disk]
  ./prompts/luna:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  image.local_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  image_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(image.local_path), PILImage.open, image_path.write_bytes]
  md_file:
    type: variable
    actions: [read]
    params:
      caller: [md_file.read_text]
  persona.md:
    type: literal
    actions: [read]
    params:
      caller: [load_prompts_from_disk]
      path: [prompts_dir]
  persona_path:
    type: variable
    actions: [read]
    params:
      caller: [persona_path.read_text]
  prompts_dir:
    type: literal
    actions: [read]
    params:
      caller: [Path('./prompts/luna'), prompts_dir.glob]
  reconstructed_path:
    type: variable
    actions: [read]
    params:
      caller: ['AssetPathManager.get_image_path(image_id=image.image_id, slide_number=image.slide_number, iteration=0)']
  video.local_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open]
  video_path:
    type: variable
    actions: [read, write]
    params:
      caller: [AssetPathManager.get_video_path(iteration=0), video_path.write_bytes]

networks:
  storage.googleapis.com:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://storage.googleapis.com/gtmforge-assets/{manifest_path}
      caller: [run]
