      src/agent_root/forge/agents/publisher_agent/agent.py, src/agent_root/forge/agent.py, src/agent_root/forge/agents/imagen_agent/__init__.py,
      src/agent_root/forge/agents/prompt_forge_agent/agent.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:40:03Z'
